version: "3.9"

services:
  requirement-engine:
    build: .
    ports:
      - "8090:8090"
    environment:
      - SPRING_APPLICATION_NAME=requirement-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
