server:
  port: 8090

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: requirement-engine

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# CORS — override in production: cors.allowed-origins=https://your-frontend.com
cors:
  allowed-origins: "*"
