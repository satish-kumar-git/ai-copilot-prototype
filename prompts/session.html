<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Copilot — Session Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --card:     #161b27;
    --border:   #252d3d;
    --accent:   #7c6dfa;
    --green:    #34d399;
    --yellow:   #fbbf24;
    --red:      #f87171;
    --blue:     #60a5fa;
    --text:     #e2e8f0;
    --muted:    #94a3b8;
    --dim:      #4b5675;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── TOP BAR ──────────────────────────────── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0c0f1a;
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .site-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  .site-title span { color: var(--accent); }

  .stat-chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #1a2035;
    color: var(--muted);
    white-space: nowrap;
  }

  .chip.done  { color: var(--green);  border-color: #1d4035; background: #0d2920; }
  .chip.prog  { color: var(--yellow); border-color: #3d3010; background: #201a06; }
  .chip.total { color: var(--accent); border-color: #2d2860; background: #14103a; }

  .topbar-right { margin-left: auto; display: flex; gap: 8px; }

  /* progress bar */
  .progress-bar {
    height: 3px;
    background: #1a2035;
    position: sticky;
    top: 53px;
    z-index: 99;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    transition: width 0.4s ease;
  }

  /* ── PAGE ──────────────────────────────────── */
  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  /* ── SEARCH + FILTER ──────────────────────── */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .toolbar input, .toolbar select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }

  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }

  /* ── ADD FORM ─────────────────────────────── */
  .add-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .add-header {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    user-select: none;
  }

  .add-header:hover { color: var(--text); }

  .add-body {
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .add-body.hidden { display: none; }

  .add-body input, .add-body textarea, .add-body select {
    background: #0f1117;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    width: 100%;
    outline: none;
    font-family: inherit;
  }

  .add-body input:focus, .add-body textarea:focus, .add-body select:focus {
    border-color: var(--accent);
  }

  .add-body textarea { resize: vertical; min-height: 80px; }
  .add-row { display: flex; gap: 8px; }
  .add-row select { flex: 1; }

  /* ── SECTION HEADER ──────────────────────── */
  .section-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--dim);
    padding: 8px 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .entry-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: #14103a;
    border: 1px solid #2d2860;
    border-radius: 12px;
    padding: 2px 8px;
  }

  /* ── ENTRY CARD ───────────────────────────── */
  .entry-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .entry-card:hover  { border-color: #3b4572; }
  .entry-card.open   { border-color: var(--accent); }

  .card-head {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }

  .lv-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 5px;
    background: #14103a;
    color: var(--accent);
    border: 1px solid #2d2860;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-title {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    min-width: 0;
  }

  .card-title small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 1px;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .s-done     { background: #0d2920; color: var(--green);  border: 1px solid #1d4035; }
  .s-progress { background: #201a06; color: var(--yellow); border: 1px solid #3d3010; }
  .s-todo     { background: #0a1628; color: var(--blue);   border: 1px solid #1a3060; }
  .s-blocked  { background: #200d0d; color: var(--red);    border: 1px solid #3d1010; }

  .arrow {
    color: var(--dim);
    font-size: 12px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .entry-card.open .arrow { transform: rotate(180deg); }

  /* card body */
  .card-body {
    display: none;
    border-top: 1px solid var(--border);
  }

  .entry-card.open .card-body { display: block; }

  /* Q / A sections */
  .qa-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .qa-section:last-child { border-bottom: none; }

  .qa-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .qa-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .ql { color: var(--accent); }
  .al { color: var(--green); }
  .nl { color: var(--yellow); }

  /* prompt text */
  .prompt-text {
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-word;
    background: #0f1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    max-height: 220px;
    overflow-y: auto;
    font-family: 'Consolas', 'Cascadia Code', monospace;
  }

  .prompt-text::-webkit-scrollbar { width: 4px; }
  .prompt-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* changes list */
  .changes-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .changes-list li {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 10px;
    background: #0f1117;
    border-radius: 6px;
    border-left: 2px solid var(--accent);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .changes-list li span { flex: 1; line-height: 1.5; }

  .changes-list li small {
    font-size: 10px;
    color: var(--dim);
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .rm-btn {
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    font-size: 11px;
    padding: 0 2px;
    flex-shrink: 0;
  }

  .rm-btn:hover { color: var(--red); }

  .add-change-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .add-change-row input {
    flex: 1;
    background: #0f1117;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    outline: none;
    font-family: inherit;
  }

  .add-change-row input:focus { border-color: var(--accent); }

  /* notes */
  .notes-ta {
    width: 100%;
    background: #0f1117;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    min-height: 90px;
    resize: vertical;
    outline: none;
    font-family: 'Consolas', monospace;
    line-height: 1.6;
  }

  .notes-ta:focus { border-color: var(--yellow); }

  /* tags */
  .tag-row { display: flex; flex-wrap: wrap; gap: 4px; }

  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: #14103a;
    color: var(--accent);
    border: 1px solid #2d2860;
  }

  /* card actions row */
  .card-actions {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--border);
    background: #0f1117;
  }

  .card-actions select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    font-family: inherit;
    cursor: pointer;
  }

  .card-meta-info { flex: 1; font-size: 11px; color: var(--dim); }

  /* ── BUTTONS ──────────────────────────────── */
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    font-family: inherit;
    transition: all 0.12s;
    background: var(--card);
    color: var(--muted);
  }

  .btn:hover { border-color: #3b4572; color: var(--text); }

  .btn-primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn-primary:hover { background: #8b7dfb; }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { border-color: #3d1010; background: #200d0d; }
  .btn-sm { padding: 4px 9px; font-size: 11px; }

  /* ── TOAST ────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  .no-entries {
    text-align: center;
    padding: 32px;
    color: var(--dim);
    font-size: 13px;
  }
</style>
</head>
<body>

<!-- ── TOP BAR ───────────────────────────────── -->
<div class="topbar">
  <div class="site-title">AI Copilot <span>Session Tracker</span></div>
  <div class="stat-chips">
    <span class="chip total" id="st-total">0 total</span>
    <span class="chip done"  id="st-done">0 done</span>
    <span class="chip prog"  id="st-prog">0 active</span>
  </div>
  <div class="topbar-right">
    <button class="btn btn-sm" onclick="exportJSON()">↑ Export</button>
    <button class="btn btn-sm" onclick="importJSON()">↓ Import</button>
  </div>
</div>

<!-- thin progress line -->
<div class="progress-bar">
  <div class="progress-fill" id="prog-fill" style="width:0%"></div>
</div>

<!-- ── PAGE ──────────────────────────────────── -->
<div class="page">

  <!-- ADD FORM -->
  <div class="add-section">
    <div class="add-header" onclick="toggleAddForm()">
      <span>+ New Prompt Entry</span>
      <span id="add-arrow">▼</span>
    </div>
    <div class="add-body hidden" id="add-body">
      <input type="text" id="inp-title" placeholder="Title — e.g. Level 6 — RequirementAnalyzerService"/>
      <textarea id="inp-prompt" placeholder="Paste the prompt here…"></textarea>
      <div class="add-row">
        <select id="inp-status">
          <option value="todo">To Do</option>
          <option value="progress">In Progress</option>
          <option value="done">Done</option>
          <option value="blocked">Blocked</option>
        </select>
        <select id="inp-category">
          <option value="">Category</option>
          <option value="feature">Feature</option>
          <option value="config">Config</option>
          <option value="testing">Testing</option>
          <option value="devops">DevOps</option>
          <option value="docs">Docs</option>
          <option value="research">Research</option>
          <option value="bugfix">Bug Fix</option>
          <option value="refactor">Refactor</option>
        </select>
      </div>
      <input type="text" id="inp-tag" placeholder="Tags — type and press Enter"/>
      <div id="new-tags" class="tag-row"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="addEntry()">Add Entry</button>
        <button class="btn" onclick="toggleAddForm()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- SEARCH + FILTER -->
  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍  Search entries…" oninput="renderList()"/>
    <select id="filter-status" onchange="renderList()">
      <option value="">All Status</option>
      <option value="todo">To Do</option>
      <option value="progress">In Progress</option>
      <option value="done">Done</option>
      <option value="blocked">Blocked</option>
    </select>
    <select id="filter-cat" onchange="renderList()">
      <option value="">All Categories</option>
      <option value="feature">Feature</option>
      <option value="config">Config</option>
      <option value="testing">Testing</option>
      <option value="devops">DevOps</option>
      <option value="docs">Docs</option>
      <option value="research">Research</option>
    </select>
  </div>

  <!-- SECTION HEADER -->
  <div class="section-header">
    <span>Prompt Entries</span>
    <span class="entry-count" id="entry-count">0</span>
  </div>

  <!-- ENTRIES LIST -->
  <div id="entry-list"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'aic-sessions-v3';
let entries = [];
let pendingTags = [];
let addOpen = false;

// ── SEED DATA ──────────────────────────────────────────────────────
const SEED = [
  {
    id:'s1', level:'L1',
    title:'System Design & Architecture',
    prompt:`You are a senior product engineer and software architect.

I want to build an "AI Copilot Prototype" — a backend service that helps software engineers move faster by transforming vague requirements into structured engineering plans with AI-ready prompt hints.

The system must:
1. Accept free-text software requirements (Greenfield / Brownfield / Ambiguous)
2. Classify into scenario types using keyword scoring
3. Decompose into ordered engineering tasks with AI prompt hints
4. Identify ambiguities, risks, and assumptions
5. Return a full structured JSON analysis

Deliverables:
1. Product vision statement
2. Core user personas (5)
3. Acceptance criteria (8, Given/When/Then)
4. Top 5 risks
5. Proposed module architecture
6. Recommended tech stack with rationale`,
    status:'done', category:'research',
    tags:['architecture','design','greenfield','product'],
    changes:[
      {text:'Created project repository and .gitignore', at:'2026-07-29T13:56:00Z'},
      {text:'Created prompts/session.html — prompt tracker', at:'2026-07-29T14:10:00Z'},
      {text:'Generated prompts/requirement-analysis.md — vision, 5 personas, 8 ACs, 5 risks, 7-module architecture, tech stack', at:'2026-07-29T14:20:00Z'},
    ],
    notes:'Saved to prompts/requirement-analysis.md\n\nKey decision: Java 21 + Spring Boot 3.3.5 over Python/FastAPI — better type safety for domain model.\nTop risk: LLM output inconsistency — mitigate with structured output + validation + retry.',
    createdAt:'2026-07-29T13:53:00Z',
  },
  {
    id:'s2', level:'L2a',
    title:'Java 21 Spring Boot Multi-Module Backend',
    prompt:`You are a senior software architect.

Design the full system architecture for ai-copilot-prototype:

1. ASCII component diagram
2. Module ownership table: core (no Spring) + requirement-engine (Spring Boot)
3. Data flow: trace single request from HTTP POST to JSON response
4. Domain model — every class, enum, record, DTO with fields
5. REST API contract: POST /api/v1/requirements/analyze + GET /health
6. Classification algorithm design (keyword scoring)`,
    status:'done', category:'feature',
    tags:['java','spring-boot','gradle','multi-module'],
    changes:[
      {text:'Created multi-module Gradle project: core + requirement-engine', at:'2026-07-29T15:00:00Z'},
      {text:'Implemented ScenarioClassifierService — keyword scoring', at:'2026-07-29T15:10:00Z'},
      {text:'Implemented TaskDecomposerService — 8 tasks per scenario with AI prompt hints', at:'2026-07-29T15:20:00Z'},
      {text:'Added RequirementController + GlobalExceptionHandler', at:'2026-07-29T15:30:00Z'},
      {text:'Fixed Gradle 9.x JUnit Platform launcher (testRuntimeOnly added)', at:'2026-07-29T15:40:00Z'},
      {text:'BUILD SUCCESSFUL — 12 tests passing', at:'2026-07-29T15:45:00Z'},
    ],
    notes:'Group: com.aiprototype | Port: 8090\nBUG fixed: GlobalExceptionHandler Collectors.toMap without merge fn on blank string.',
    createdAt:'2026-07-29T15:00:00Z',
  },
  {
    id:'s3', level:'L2b',
    title:'Gradle Scaffold Upgrade (Lombok, Springdoc, Actuator, Virtual Threads)',
    prompt:`You are a senior Java engineer.

Generate the complete Gradle multi-module scaffold from scratch.
Group: com.aiprototype | Java 21 | Modules: core + requirement-engine (Spring Boot 3.3.5)

Files to generate:
1. settings.gradle.kts
2. build.gradle.kts (root)
3. gradle.properties — daemon, parallel, caching enabled
4. core/build.gradle.kts — BOM, validation, springdoc 2.6.0, Lombok
5. requirement-engine/build.gradle.kts — Spring Boot 3.3.5, web, actuator, springdoc, Lombok, bootJar
6. application.yml — port 8090, virtual threads, actuator, springdoc
7. RequirementEngineApplication.java`,
    status:'done', category:'config',
    tags:['gradle','lombok','springdoc','actuator','virtual-threads'],
    changes:[
      {text:'Group migrated: com.aicopilot → com.aiprototype across all 18 source files', at:'2026-07-29T16:00:00Z'},
      {text:'Lombok added to both modules (compileOnly + annotationProcessor)', at:'2026-07-29T16:05:00Z'},
      {text:'Springdoc added → Swagger UI at /swagger-ui.html', at:'2026-07-29T16:06:00Z'},
      {text:'spring.threads.virtual.enabled=true, port 8090', at:'2026-07-29T16:08:00Z'},
      {text:'BUILD SUCCESSFUL — 12 tests passing after clean build', at:'2026-07-29T16:15:00Z'},
    ],
    notes:'Port: 8090 | Swagger UI: /swagger-ui.html | API docs: /api-docs\nbootJar renamed → requirement-engine.jar',
    createdAt:'2026-07-29T16:00:00Z',
  },
  {
    id:'s4', level:'L3',
    title:'Core Module — Domain Classes, Enums, Records, DTOs',
    prompt:`You are a senior Java engineer.

Build the core module: all shared domain classes in com.aiprototype.core (no Spring Boot).

Enums:
  ScenarioType — GREENFIELD, BROWNFIELD, AMBIGUOUS
  Priority     — HIGH, MEDIUM, LOW
  TaskCategory — 8 values (SCHEMA_DESIGN, API_DESIGN, SERVICE_IMPLEMENTATION, TESTING, DOCUMENTATION, CONFIGURATION, REFACTORING, BUG_FIX)

Record:
  ClassificationResult(ScenarioType type, String rationale)

Domain (@Data @Builder):
  EngineeringTask — id, title, description, category, priority, @Builder.Default List<String> dependencies, aiPromptHint
  RequirementAnalysis — analysisId, requirement, ScenarioType, rationale, identifiedAmbiguities, taskBreakdown, risks, assumptions, analyzedAt

DTOs with @Schema:
  RequirementRequest (@Data) — requirement (@NotBlank @Size 10-5000), context
  TaskDto (@Data @Builder) — all EngineeringTask fields as String
  AnalysisResponse (@Data @Builder) — all RequirementAnalysis fields as String`,
    status:'done', category:'feature',
    tags:['core','domain','lombok','dto','openapi','jakarta-validation'],
    changes:[
      {text:'Moved enums from enums/ → domain/ package', at:'2026-07-29T16:30:00Z'},
      {text:'EngineeringTask — manual Builder → Lombok @Data @Builder + @Builder.Default dependencies', at:'2026-07-29T16:35:00Z'},
      {text:'RequirementRequest — record → @Data + @NoArgsConstructor @AllArgsConstructor + @Schema', at:'2026-07-29T16:40:00Z'},
      {text:'TaskDto + AnalysisResponse — records → @Data @Builder; enums → String; @Schema on every field', at:'2026-07-29T16:42:00Z'},
      {text:'AnalysisMapper — switched to builder pattern with .name() for enum→String', at:'2026-07-29T16:50:00Z'},
      {text:'BUILD SUCCESSFUL', at:'2026-07-29T16:55:00Z'},
    ],
    notes:'Package layout:\n  core.domain → enums + ClassificationResult + EngineeringTask + RequirementAnalysis\n  core.dto    → RequirementRequest, TaskDto, AnalysisResponse\n\nDTO fields are String (not enums/LocalDateTime) — serialization via .name().',
    createdAt:'2026-07-29T16:30:00Z',
  },
  {
    id:'s5', level:'L4',
    title:'ScenarioClassifierService — Set<String> Keyword Scoring',
    prompt:`Implement ScenarioClassifierService in com.aiprototype.engine.service.

GREENFIELD_KEYWORDS (14, Set<String>):
  build, create, new, implement, design, develop, from scratch, initial, setup, bootstrap, scaffold, start, launch, introduce

BROWNFIELD_KEYWORDS (21, Set<String>):
  fix, bug, enhance, add, improve, refactor, migrate, upgrade, update, extend, modify, change, existing, current, legacy, replace, rewrite, performance, optimize, scale up, regression

classify(String requirement):
  1. Lowercase the input

// ── PERSISTENCE ──────────────────────────────────────────────────────
function load() {
  try {
    let stored = JSON.parse(localStorage.getItem(KEY)) || [];
    const ids = new Set(stored.map(e => e.id));
    const fresh = SEED.filter(s => !ids.has(s.id));
    entries = [...stored, ...fresh];
    if (!entries.length) entries = [...SEED];
    save();
  } catch {
    entries = [...SEED];
    save();
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(entries));
}

// ── ADD FORM TOGGLE ──────────────────────────────────────────────────
function toggleAddForm() {
  addOpen = !addOpen;
  document.getElementById('add-body').classList.toggle('hidden', !addOpen);
  document.getElementById('add-arrow').textContent = addOpen ? '▲' : '▼';
}

// ── TAG INPUT ────────────────────────────────────────────────────────
document.getElementById('inp-tag').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = this.value.trim();
    if (v && !pendingTags.includes(v)) { pendingTags.push(v); renderPendingTags(); }
    this.value = '';
  }
});

function renderPendingTags() {
  document.getElementById('new-tags').innerHTML =
    pendingTags.map((t, i) =>
      '<span class="tag" style="cursor:pointer" onclick="removeTag(' + i + ')">' + esc(t) + ' ✕</span>'
    ).join('');
}

function removeTag(i) { pendingTags.splice(i, 1); renderPendingTags(); }

// ── ADD ENTRY ────────────────────────────────────────────────────────
function addEntry() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { showToast('Enter a title first.', 'red'); return; }
  const e = {
    id: Date.now().toString(),
    level: '',
    title: title,
    prompt: document.getElementById('inp-prompt').value.trim(),
    status: document.getElementById('inp-status').value,
    category: document.getElementById('inp-category').value,
    tags: pendingTags.slice(),
    changes: [],
    notes: '',
    createdAt: new Date().toISOString(),
  };
  entries.push(e);
  save();
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-prompt').value = '';
  document.getElementById('inp-status').value = 'todo';
  document.getElementById('inp-category').value = '';
  pendingTags = [];
  renderPendingTags();
  toggleAddForm();
  renderList();
  showToast('Entry added!');
}

// ── RENDER LIST ──────────────────────────────────────────────────────
function renderList() {
  const q  = document.getElementById('search').value.toLowerCase();
  const fs = document.getElementById('filter-status').value;
  const fc = document.getElementById('filter-cat').value;

  const filtered = entries.filter(function(e) {
    const mq = !q || e.title.toLowerCase().includes(q)
              || (e.prompt||'').toLowerCase().includes(q)
              || e.tags.some(function(t){ return t.toLowerCase().includes(q); });
    const ms = !fs || e.status === fs;
    const mc = !fc || e.category === fc;
    return mq && ms && mc;
  });

  document.getElementById('entry-count').textContent = filtered.length;
  updateStats();

  var list = document.getElementById('entry-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="no-entries">No entries match your filters.</div>';
    return;
  }

  list.innerHTML = filtered.map(function(e) { return cardHTML(e); }).join('');
}

function cardHTML(e) {
  var lvl = e.level || levelFromTitle(e.title);
  var sc  = 's-' + e.status;
  var sl  = statusLabel(e.status);

  var tagsHTML = e.tags.length
    ? '<div class="tag-row" style="flex-shrink:0">' + e.tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
    : '';

  var changesHTML = e.changes.length
    ? '<ul class="changes-list">' + e.changes.map(function(c, i) {
        return '<li>'
          + '<span>' + esc(c.text) + '</span>'
          + '<small>' + fmtDate(c.at) + '</small>'
          + '<button class="rm-btn" onclick="event.stopPropagation();removeChange(\'' + e.id + '\',' + i + ')" title="Remove">✕</button>'
          + '</li>';
      }).join('') + '</ul>'
    : '<div style="font-size:12px;color:var(--dim);padding:4px 0;">No changes logged yet.</div>';

  return '<div class="entry-card" id="card-' + e.id + '">'
    + '<div class="card-head" onclick="toggleCard(\'' + e.id + '\')">'
    + (lvl ? '<span class="lv-badge">' + esc(lvl) + '</span>' : '')
    + '<div class="card-title">'
    + esc(e.title)
    + (e.category
        ? '<small>' + esc(e.category) + ' · ' + fmtDate(e.createdAt) + '</small>'
        : '<small>' + fmtDate(e.createdAt) + '</small>')
    + '</div>'
    + tagsHTML
    + '<span class="status-badge ' + sc + '">' + sl + '</span>'
    + '<span class="arrow">▼</span>'
    + '</div>'

    + '<div class="card-body">'

    // Q
    + '<div class="qa-section">'
    + '<div class="qa-label ql">Q — Prompt</div>'
    + '<div class="prompt-text">' + esc(e.prompt || '(no prompt text)') + '</div>'
    + '</div>'

    // A
    + '<div class="qa-section">'
    + '<div class="qa-label al">A — Changes &amp; Outcomes</div>'
    + changesHTML
    + '<div class="add-change-row">'
    + '<input type="text" id="ci-' + e.id + '" placeholder="Log a change or outcome…"'
    + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();addChange(\'' + e.id + '\')}" />'
    + '<button class="btn btn-sm" onclick="addChange(\'' + e.id + '\')">Log</button>'
    + '</div>'
    + '</div>'

    // Notes
    + '<div class="qa-section">'
    + '<div class="qa-label nl">Notes</div>'
    + '<textarea class="notes-ta" id="nt-' + e.id + '"'
    + ' placeholder="Key decisions, gotchas, context…"'
    + ' oninput="updateNotes(\'' + e.id + '\')">' + esc(e.notes||'') + '</textarea>'
    + '</div>'

    // Actions
    + '<div class="card-actions">'
    + '<select onchange="updateStatus(\'' + e.id + '\',this.value)">'
    + ['todo','progress','done','blocked'].map(function(s){
        return '<option value="' + s + '"' + (e.status===s?' selected':'') + '>' + statusLabel(s) + '</option>';
      }).join('')
    + '</select>'
    + '<span class="card-meta-info">' + e.changes.length + ' change' + (e.changes.length!==1?'s':'') + '</span>'
    + '<button class="btn btn-sm btn-danger" onclick="deleteEntry(\'' + e.id + '\')">Delete</button>'
    + '</div>'

    + '</div>'
    + '</div>';
}

// ── CARD TOGGLE ──────────────────────────────────────────────────────
function toggleCard(id) {
  var card = document.getElementById('card-' + id);
  if (card) card.classList.toggle('open');
}

// ── CHANGES ──────────────────────────────────────────────────────────
function addChange(id) {
  var inp = document.getElementById('ci-' + id);
  if (!inp) return;
  var text = inp.value.trim();
  if (!text) return;
  var e = entries.find(function(x){ return x.id === id; });
  if (!e) return;
  e.changes.push({ text: text, at: new Date().toISOString() });
  save();
  inp.value = '';
  rerenderCard(id);
  showToast('Change logged.');
}

function removeChange(id, idx) {
  var e = entries.find(function(x){ return x.id === id; });
  if (!e) return;
  e.changes.splice(idx, 1);
  save();
  rerenderCard(id);
}

// ── NOTES ────────────────────────────────────────────────────────────
var noteTimers = {};
function updateNotes(id) {
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(function() {
    var e = entries.find(function(x){ return x.id === id; });
    if (!e) return;
    var ta = document.getElementById('nt-' + id);
    if (ta) { e.notes = ta.value; save(); }
  }, 600);
}

// ── STATUS ────────────────────────────────────────────────────────────
function updateStatus(id, val) {
  var e = entries.find(function(x){ return x.id === id; });
  if (!e) return;
  e.status = val;
  save();
  rerenderCard(id);
  updateStats();
  showToast('Status updated.');
}

// ── DELETE ────────────────────────────────────────────────────────────
function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(function(x){ return x.id !== id; });
  save();
  var card = document.getElementById('card-' + id);
  if (card) card.remove();
  var cnt = document.getElementById('entry-count');
  cnt.textContent = parseInt(cnt.textContent) - 1;
  updateStats();
  showToast('Entry deleted.', 'red');
}

// ── RE-RENDER SINGLE CARD ─────────────────────────────────────────────
function rerenderCard(id) {
  var e = entries.find(function(x){ return x.id === id; });
  if (!e) return;
  var card = document.getElementById('card-' + id);
  if (!card) return;
  var wasOpen = card.classList.contains('open');
  var tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(e);
  var newCard = tmp.firstElementChild;
  if (wasOpen) newCard.classList.add('open');
  card.replaceWith(newCard);
}

// ── STATS ─────────────────────────────────────────────────────────────
function updateStats() {
  var total = entries.length;
  var done  = entries.filter(function(e){ return e.status === 'done'; }).length;
  var prog  = entries.filter(function(e){ return e.status === 'progress'; }).length;
  document.getElementById('st-total').textContent = total + ' total';
  document.getElementById('st-done').textContent  = done  + ' done';
  document.getElementById('st-prog').textContent  = prog  + ' active';
  var pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────
function exportJSON() {
  var blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'copilot-sessions-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importJSON() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = function(ev) {
    var file = ev.target.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function(e2) {
      try {
        var data = JSON.parse(e2.target.result);
        if (Array.isArray(data)) { entries = data; save(); renderList(); showToast('Imported ' + data.length + ' entries.'); }
      } catch(err) { showToast('Invalid JSON.', 'red'); }
    };
    r.readAsText(file);
  };
  inp.click();
}

// ── HELPERS ───────────────────────────────────────────────────────────
function statusLabel(s) {
  return {todo:'To Do', progress:'In Progress', done:'Done', blocked:'Blocked'}[s] || s;
}

function levelFromTitle(t) {
  var m = t.match(/^Level\s+(\d+)/i);
  return m ? 'L' + m[1] : '';
}

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})
       + ' ' + d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderLeftColor = type === 'red' ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ── INIT ──────────────────────────────────────────────────────────────
load();
renderList();
</script>
</body>
</html>
